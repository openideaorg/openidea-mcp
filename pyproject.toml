[project]
name = "mcp-openidea-search"
dynamic = ["version"]
description = "MCP server for Open Idea federated search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Open Idea" }]
keywords = ["mcp", "openidea", "search", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
]

[project.urls]
Homepage = "https://www.openidea.world"
Repository = "https://github.com/Sony17/OpenIdeaMcp-"

[project.scripts]
mcp-openidea-search = "mcp_openidea_search.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mcp_openidea_search/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openidea_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
