[project]
name = "mcp-openidea-search"
version = "0.1.0"
description = "MCP server for Open Idea federated search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Idea" }]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
]

[project.scripts]
mcp-openidea-search = "mcp_openidea_search.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_openidea_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
